[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agrostream-iot"
version = "0.1.0"
description = "Plataforma local de sensores IoT agrícolas en tiempo real"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.40,<2",
  "confluent-kafka>=2.6,<3",
  "pymongo>=4.9,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<6",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools]
packages = ["shared", "producer_api", "consumer", "web_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
