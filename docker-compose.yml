name: agrostream

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Copia .env.example a .env antes de levantar los servicios}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  mongodb:
    image: mongo:7.0
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Define MONGO_INITDB_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Define MONGO_INITDB_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-agrostream}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka_ui:
    image: provectuslabs/kafka-ui:v0.7.2
    hostname: kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: agrostream-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_HOST_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  kafka_init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/create_topics.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  mongo_init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/init_mongodb.py"]
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-agrostream}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-agrostream}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  producer_api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "producer_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-agrostream}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-agrostream}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-10000}
      PRODUCER_COMPRESSION_TYPE: ${PRODUCER_COMPRESSION_TYPE:-lz4}
      PRODUCER_LINGER_MS: ${PRODUCER_LINGER_MS:-10}
      PRODUCER_BATCH_SIZE: ${PRODUCER_BATCH_SIZE:-131072}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mongo_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "consumer.main"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-agrostream}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-agrostream}
      CONSUMER_POLL_TIMEOUT_SECONDS: ${CONSUMER_POLL_TIMEOUT_SECONDS:-1}
      ALERT_RATE_MEDIUM_PERCENT: ${ALERT_RATE_MEDIUM_PERCENT:-10}
      ALERT_RATE_HIGH_PERCENT: ${ALERT_RATE_HIGH_PERCENT:-30}
    depends_on:
      kafka_init:
        condition: service_completed_successfully
      mongo_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/agrostream_consumer_heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web_ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "web_ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_BASE_URL: http://producer_api:8000
    ports:
      - "${STREAMLIT_HOST_PORT:-8501}:8501"
    depends_on:
      producer_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

volumes:
  kafka_data:
    name: agrostream_kafka_data
  mongo_data:
    name: agrostream_mongo_data
